<style>
/* Follows DESIGN.md: white paper, navy brand, Spectral headlines, Albert Sans body, 2px radius, no shadows.
   One deliberate exception: the night band behind the type reveal on the result screen. */
:root{
  --ink:#14141F; --ink-soft:#4B4B57; --line:#DCDDE1; --paper:#FFFFFF; --mist:#EEF0F2;
  --brand:#010066; --brand-hover:#1A1A85; --pick:#E9E9F6; --night:#0A0A2E; --night-line:#2C2C55;
  --night-soft:#C4C4DE; --error:#B3261E; --ok:#1F7A4D;
  --serif:'Spectral', Georgia, 'Times New Roman', serif;
  --sans:'Albert Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65;min-height:100vh}
body.mist{background:var(--mist)}
.wrap{max-width:640px;margin:0 auto;padding:24px max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.brandline{font-family:var(--serif);font-weight:500;font-size:18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(36px,9vw,48px);line-height:1.08}
h2{font-size:clamp(26px,6.4vw,32px);line-height:1.2}
h3{font-size:22px;line-height:1.3}
p{text-wrap:pretty}
.lead{font-size:19px;line-height:1.6;color:var(--ink-soft)}
.soft{color:var(--ink-soft)}
.small{font-size:14px;line-height:1.5;color:var(--ink-soft)}
.center{text-align:center}
.stack{display:flex;flex-direction:column;gap:24px}
.stack-s{display:flex;flex-direction:column;gap:12px}
.grow{flex-grow:1}
.mid{flex-grow:1;display:flex;flex-direction:column;justify-content:center;gap:24px;padding:32px 0}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* progress */
.prog{display:flex;flex-direction:column;gap:10px;margin-bottom:32px}
.prog-top{display:flex;justify-content:space-between;gap:16px;font-size:14px;color:var(--ink-soft)}
.bar{height:2px;background:var(--line)}
.bar i{display:block;height:2px;background:var(--brand);transition:width .25s ease}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:14px 28px;background:var(--brand);color:#fff;border:0;border-radius:2px;font:600 16px var(--sans);cursor:pointer;text-decoration:none;width:100%}
.btn:hover{background:var(--brand-hover)}
.btn:disabled{opacity:.35;cursor:default;background:var(--brand)}
.btn.inline{width:auto}
.link{background:none;border:0;padding:12px 0;font:600 16px var(--sans);color:var(--brand);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;cursor:pointer}
.link:hover{text-decoration-thickness:2px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:32px}
.btn:focus-visible,.link:focus-visible,.opt:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.chip:focus-within,.seg label:focus-within{outline:2px solid var(--brand);outline-offset:3px}

/* question options */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:block;width:100%;text-align:left;font:400 16px/1.45 var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:16px;min-height:56px;cursor:pointer}
.opt:hover{border-color:#B9BAC2}
.opt[aria-pressed="true"]{font-weight:600;color:var(--brand);background:var(--pick);border-color:var(--brand)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.q{font-weight:600;font-size:16px;line-height:1.4}
.hint{font-size:14px;color:var(--ink-soft);font-weight:400;line-height:1.45}
.req{color:var(--ink-soft);font-weight:400}
input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;font:16px var(--sans);color:var(--ink);background:var(--paper);padding:13px 14px;border:1px solid var(--line);border-radius:2px;outline:none}
textarea{min-height:96px;resize:vertical;line-height:1.5}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-position:calc(100% - 20px) 54%,calc(100% - 14px) 54%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
input:focus,textarea:focus,select:focus{border-color:var(--brand)}
.invalid input,.invalid textarea,.invalid select,.invalid .chips,.invalid .seg{border-color:var(--error)}
.invalid .chips,.invalid .seg{outline:1px solid var(--error);outline-offset:4px}
.ferr{color:var(--error);font-size:14px;min-height:1.2em}
.chips{display:flex;flex-direction:column;gap:8px}
.chip{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:2px;padding:13px 14px;cursor:pointer;font-size:16px;line-height:1.4}
.chip input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--brand)}
.chip:has(input:checked){border-color:var(--brand);background:var(--pick);color:var(--brand)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg label{display:flex;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:8px;border:1px solid var(--line);border-radius:2px;font-size:15px;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--brand);background:var(--pick);color:var(--brand);font-weight:600}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--ink-soft);cursor:pointer}
.consent input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--brand)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* lists */
.rows{border-top:1px solid var(--line)}
.rows>div{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:16px}
.rows .v{color:var(--ink-soft);font-size:15px;text-align:right}
.split{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.split>div{flex:1;padding:16px 0}
.split>div+div{border-left:1px solid var(--line);padding-left:16px}
.split b{display:block;font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.2}
.callplan{list-style:none;counter-reset:c;border-top:1px solid var(--line)}
.callplan li{counter-increment:c;display:grid;grid-template-columns:32px 1fr;gap:8px;padding:16px 0;border-bottom:1px solid var(--line)}
.callplan li::before{content:counter(c);font-family:var(--serif);font-size:22px;line-height:1.2;color:var(--brand)}
.callplan b{display:block;font-weight:600}
.callplan span{color:var(--ink-soft);font-size:16px}

/* result */
.res{display:flex;flex-direction:column}
.res .wrap{min-height:0;padding-bottom:0}
.night{background:var(--night);color:#fff}
.night .brandline{border-color:var(--night-line)}
.night .wrap{padding-bottom:48px}
.night .kick{font-size:15px;color:var(--night-soft);margin-top:32px}
.night h1{margin:12px 0 20px}
.night .lead{color:#E2E2F0}
.night .small{color:var(--night-soft);margin-top:20px}
.map{display:flex;flex-direction:column;gap:16px}
.dim{display:flex;flex-direction:column;gap:6px}
.dim-top{display:flex;justify-content:space-between;font-size:15px}
.dim-top b{font-weight:600}
.dim-bar{height:6px;background:var(--mist)}
.dim-bar i{display:block;height:6px;background:var(--brand);width:0;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.dim p{font-size:15px;color:var(--ink-soft);line-height:1.5}
.goal{font-size:17px;border-left:2px solid var(--brand);padding:4px 0 4px 16px}
.sec{padding-top:24px;border-top:1px solid var(--line)}
.fix{background:var(--mist);padding:24px;display:flex;flex-direction:column;gap:14px}
.fix ol{padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:16px;line-height:1.6}
.end{padding:48px 0 56px;display:flex;flex-direction:column;gap:14px;text-align:center}
.spin{width:28px;height:28px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.dim-bar i,.bar i{transition:none}.spin{animation:none}}
</style>
</head>
